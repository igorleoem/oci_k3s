apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 9.7.0
    releaseName: argocd
    namespace: argocd
    valuesInline:
      server:
        config:
          kustomize.buildOptions: "--enable-helm"
        extraArgs:
          - --insecure
        service:
          type: ClusterIP
